<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>토트봇 | 민양테크</title>
    <link rel="stylesheet" href="../assets/css/header-unified.css">
    <style>
        :root{--accent:#007bff;--txt:#333;--bg:#fff;--brd:#eee;--card:#f9f9f9}body.dark-mode{--txt:#f5f5f5;--bg:#121212;--brd:#333;--card:#1e1e1e}*{box-sizing:border-box}body{margin:0;font-family:Pretendard,sans-serif;background:var(--bg);color:var(--txt);transition:.3s}header{height:80px;display:flex;align-items:center;justify-content:space-between;padding:0 5%;border-bottom:1px solid var(--brd)}.logo-link img{height:40px}.switch{width:44px;height:22px;position:relative;display:inline-block}.switch input{opacity:0;width:0}.slider{position:absolute;inset:0;background:#ccc;border-radius:20px;cursor:pointer}.slider:before{content:"";position:absolute;width:16px;height:16px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s}input:checked+.slider{background:var(--accent)}input:checked+.slider:before{transform:translateX(22px)}main{min-height:calc(100vh - 160px);max-width:980px;margin:auto;padding:80px 20px}footer{text-align:center;padding:45px 20px;border-top:1px solid var(--brd);font-size:13px;opacity:.6}
    </style>
</head>
<body>
    <header><a href="https://minyangtech.n-e.kr" class="logo-link"><img src="https://minyangtech.n-e.kr/image/%EB%AF%BC%EC%96%91%20%ED%85%8C%ED%81%AC.png" alt="민양테크"></a><label class="switch"><input type="checkbox" id="dark-mode-toggle"><span class="slider"></span></label></header>
    <main></main>
    <footer>Copyright © 2026 Minyang Tech. All rights reserved.</footer>
    <script>const t=document.getElementById('dark-mode-toggle');function theme(d){document.body.classList.toggle('dark-mode',d);t.checked=d;localStorage.setItem('darkMode',d?'enabled':'disabled')}t.addEventListener('change',()=>theme(t.checked));if(localStorage.getItem('darkMode')==='enabled'||(!localStorage.getItem('darkMode')&&matchMedia('(prefers-color-scheme: dark)').matches))theme(true);</script>
</body>
</html>
